<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>demo_crowd3d dev</title>
    <style>
      body { margin: 0; background: #0b0b0e; display: grid; place-items: center; height: 100vh }
      canvas { grid-area: 1 / 1 }
      .lil-gui.root { max-height: 100vh; overflow-y: auto }
    </style>
  </head>
  <body>
    <script type="module">
      // The demo of crowd3d: index.html, the manager truth and the scenes its row names all in this
      // tab, one seat on them over a loopback, stepped on the page's clock, and a panel holding every
      // number of `world.crowd3d` and the render3d settings that change how it looks or what it costs.
      // `?scene=<scene>` enters that scene. The truths are kept on `window.__scenes` and the page on
      // `window.__page` for the profilers (benchmarking-a-game). The frame rate is three's stats panel,
      // the stats plugin, at the top left.
      //
      // The keys are the testbed's own (devBinds, below), laid over the seat's, so no click takes the
      // pointer and the panel is clicked freely: W and S fly forward and back, A and D turn left and
      // right, E and Q tilt up and down, Shift climbs and Control sinks, and the wheel, turned anywhere
      // but over the panel, paces. A click on the game is the seat's own: it kills the person clicked.
      //
      // The panel tweaks a copy of the scene's `world.crowd3d`. A change is laid into the truth's world
      // and the page's a quarter second after the last one, so the server's rules and the page's look
      // read the same numbers; a change to a number the plugin reads only on its first frame (FIRST)
      // closes the page's plugin so the next frame builds it again. Nothing is written to disk:
      // `copy crowd3d JSON` copies the panel's numbers, for the scene file, and `reset to the file` puts
      // the file's back.
      //
      // `people` is how many of the standing crowd stand, its top the whole crowd. Lowered, the people
      // past it are ended in the truth, the last the crowd stood first, each kept as it then was; raised,
      // they are spawned again from what was kept, where they stood, dead or alive.
      //
      // The render3d folder: the pixel ratio, drawn smooth or as blocks; the exposure and the tone
      // mapping; the shadows on or off; the AO's and the bloom's numbers, on their passes as they draw. The AO and the bloom
      // on or off load the page again with `?ao=` and `?bloom=`, since the renderer's reversed depth and
      // its composer are fixed when it is made.
      import { boot } from '#engine/engine.ts'
      import { accept, load, manager, link, view } from '#addons/scenemanager/scenemanager.addon.ts'
      import { loopback } from '#addons/loopback/loopback.addon.ts'
      import GUI from 'lil-gui'
      import { sim } from './demo_crowd3d.sim.ts'
      import { scene as main } from './main.sim.ts'
      import file from './demo_crowd3d.scene.json'

      const clone = v => JSON.parse(JSON.stringify(v))
      const params = new URLSearchParams(location.search)
      file.prefabs.scenemanager.entry = params.get('scene') ?? file.prefabs.scenemanager.entry
      // The AO and the bloom, on or off from the address, before the renderer is made.
      const r3 = main.prefabs.render3d
      const fileBloom = clone(r3.bloom)
      if (params.has('ao')) r3.ao.on = params.get('ao') === '1'
      if (params.get('bloom') === '0') delete r3.bloom
      // The file's numbers, as they were, for `reset to the file`.
      const fileOwn = clone(main.world.crowd3d)

      const dt = file.prefabs.engine.dt
      const truth = boot(file, sim)
      window.__scenes = await load(truth, import.meta.url)
      let client
      // The testbed's own keys, bound in place of whatever the seat's look binds.
      const TURN = 1.4, TILT = 0.9 // radians a second
      let turned = performance.now()
      const devBinds = {
        stick: [{ keys: ['F13', 'F14', 'w', 's'], send: (x, y) => ['stick', x, y] }],
        hold: [
          { keys: ['Shift'], send: v => ['up', v] },
          { keys: ['Control'], send: v => ['down', v] },
        ],
        every: held => {
          const now = performance.now(), dt = Math.min((now - turned) / 1000, 0.1)
          turned = now
          const yaw = (held('a') ? 1 : 0) - (held('d') ? 1 : 0), pitch = (held('q') ? 1 : 0) - (held('e') ? 1 : 0)
          return yaw || pitch ? ['look', yaw * TURN * dt, pitch * TILT * dt] : undefined
        },
        wheel: dy => ['pace', dy],
      }
      const page = view(link(loopback(accept(manager(truth)))), file, import.meta.url, (me, scene) => {
        client = me
        const player = me.plugins.player
        if (player) { const bind = player.bind.bind(player); player.bind = table => bind({ ...table, ...devBinds }) }
        for (const surface of [me.plugins.render3d ?? me.plugins.render2d, me.plugins.ui]) {
          if (!surface) continue
          const canvas = document.createElement('canvas')
          canvas.width = scene.prefabs.engine.width
          canvas.height = scene.prefabs.engine.height
          document.body.appendChild(canvas)
          surface.mount(canvas)
        }
        me.plugins.stats?.mount(document.body)
      })
      window.__page = page
      // The truth of the scene the seat is on.
      const room = () => window.__scenes.get(chosen.scene)

      // The panel: the scene, chosen from the manager's table, the page loaded again on it. Keys typed
      // into it, the wheel turned over it and clicks on it reach neither this page nor the eye, so the
      // wheel scrolls the panel and a click on it kills nobody.
      const gui = new GUI({ title: 'demo_crowd3d dev' })
      for (const type of ['keydown', 'keyup', 'wheel', 'click']) gui.domElement.addEventListener(type, e => e.stopPropagation())
      const chosen = { scene: file.prefabs.scenemanager.entry }
      const reload = (key, value) => {
        const url = new URL(location.href)
        url.searchParams.set(key, value)
        location.href = url.href
      }
      gui.add(chosen, 'scene', Object.keys(file.prefabs.scenemanager.scenes)).onChange(s => reload('scene', s))

      // ---------- crowd3d ----------

      // The panel's copy of world.crowd3d.
      const own = clone(fileOwn)
      // The numbers the plugin reads only on its first frame, from its header: every clip is baked at
      // `rate` once, when its body's model lands.
      const FIRST = ['rate']
      let built = JSON.stringify(FIRST.map(k => own[k]))
      // The panel's copy laid into the truth's world and the page's a quarter second after the last
      // change, and the page's plugin closed when a first-frame number changed, so it is built again.
      let timer
      const apply = () => {
        clearTimeout(timer)
        timer = setTimeout(() => {
          for (const world of [room()?.world, client?.plugins.wire.scene.world]) if (world) Object.assign(world.crowd3d, clone(own))
          const first = JSON.stringify(FIRST.map(k => own[k]))
          if (first !== built) {
            built = first
            client?.plugins.crowd3d.close()
          }
        }, 250)
      }
      const num = (folder, o, key, lo, hi, step, name) => folder.add(o, key, lo, hi, step).name(name ?? key).onChange(apply)

      const pf = gui.addFolder('crowd3d')
      num(pf, own, 'rate', 5, 120, 1, 'bake rate (frames a second)')

      // The standing crowd, in the order the crowd stood it: the people standing after the step the crowd
      // is placed on, before any gate has sent anyone, each its row while it stands and what it was when
      // it was ended. The slider is made then, its top the crowd's whole size.
      const standing = []
      const people = { count: 0 }
      const stand = n => {
        const truth = room()
        standing.forEach((p, i) => {
          if (i < n && !p.row) p.row = truth.spawn('person', clone(p.data))
          if (i >= n && p.row) {
            p.data = clone(p.row.data)
            truth.end(p.row)
            p.row = undefined
          }
        })
      }
      room()?.onStep(() => {
        if (standing.length) return
        const truth = room()
        if (!truth.rows.some(r => r.kind === 'crowd' && r.data.placed)) return
        for (const row of truth.rows) if (row.kind === 'person') standing.push({ row, data: undefined })
        people.count = standing.length
        pf.add(people, 'count', 0, standing.length, 1).name('people').onChange(stand)
      })

      gui.add({ copy: () => navigator.clipboard?.writeText(JSON.stringify(own, null, 2)) }, 'copy').name('copy crowd3d JSON')
      // The file's numbers written into the panel's copy, key by key, so every control keeps its object.
      const into = (to, from) => {
        for (const [k, v] of Object.entries(from)) {
          if (v && typeof v === 'object') into(to[k], v)
          else to[k] = v
        }
      }
      gui.add({ reset: () => {
        into(own, fileOwn)
        for (const c of gui.controllersRecursive()) c.updateDisplay()
        apply()
      } }, 'reset').name('reset to the file')

      // ---------- render3d ----------

      const rf = gui.addFolder('render3d')
      rf.close()
      const r3d = () => client?.plugins.render3d
      const look = { ratio: r3.pixelRatio ?? 1, blocks: false, exposure: r3.exposure ?? 1, tone: r3.tone ?? 'none' }
      const ratio = () => r3d()?.ratio(look.ratio, look.blocks ? 'blocks' : 'smooth')
      rf.add(look, 'ratio', 0.1, 3, 0.05).name('pixel ratio').onChange(ratio)
      rf.add(look, 'blocks').name('pixels as blocks').onChange(ratio)
      rf.add(look, 'exposure', 0, 4, 0.01).onChange(v => {
        const renderer = r3d()?.renderer
        if (renderer) renderer.toneMappingExposure = v
      })
      rf.add(look, 'tone', ['neutral', 'none']).name('tone mapping').onChange(v => {
        const three = r3d()?.THREE, renderer = r3d()?.renderer
        if (renderer) renderer.toneMapping = v === 'neutral' ? three.NeutralToneMapping : three.NoToneMapping
      })
      // The shadows on or off as the page draws, on as the file's kind of shadow (soft when the file has
      // none). Three builds a material's shader with or without shadows and builds it again only when told,
      // so every material in the scene is marked to be built again.
      const shade = r3.shadows && r3.shadows !== 'none' ? r3.shadows : 'soft'
      rf.add({ shadows: shade === r3.shadows }, 'shadows').onChange(on => {
        client.plugins.wire.scene.prefabs.render3d.shadows = on ? shade : 'none'
        const three = r3d()?.THREE, renderer = r3d()?.renderer
        if (!renderer) return
        renderer.shadowMap.enabled = on
        renderer.shadowMap.type = shade === 'hard' ? three.BasicShadowMap : three.PCFShadowMap
        r3d().scene.traverse(o => {
          for (const m of [o.material ?? []].flat()) m.needsUpdate = true
        })
      })
      // The passes of the composer as it draws: the AO's and the bloom's.
      const passOf = has => r3d()?.composer?.passes.find(has)
      const ao = clone(r3.ao)
      const af = rf.addFolder('ao')
      af.close()
      af.add({ on: !!r3.ao.on }, 'on').onChange(v => reload('ao', v ? '1' : '0'))
      const setAo = () => {
        Object.assign(client.plugins.wire.scene.prefabs.render3d.ao, ao)
        const gtao = passOf(p => 'updateGtaoMaterial' in p)
        if (!gtao) return
        gtao.updateGtaoMaterial({ radius: ao.radius, thickness: ao.thickness, distanceFallOff: ao.falloff, scale: ao.scale, samples: ao.samples })
        gtao.blendIntensity = ao.intensity
      }
      af.add(ao, 'radius', 0.01, 10, 0.01).onChange(setAo)
      af.add(ao, 'thickness', 0.01, 5, 0.01).onChange(setAo)
      af.add(ao, 'falloff', 0, 5, 0.01).onChange(setAo)
      af.add(ao, 'scale', 0, 5, 0.01).onChange(setAo)
      af.add(ao, 'intensity', 0, 2, 0.01).onChange(setAo)
      af.add(ao, 'samples', 2, 32, 1).onChange(setAo)
      const bloom = clone(fileBloom)
      const bf = rf.addFolder('bloom')
      bf.close()
      bf.add({ on: !!r3.bloom }, 'on').onChange(v => reload('bloom', v ? '1' : '0'))
      const setBloom = () => {
        const prefab = client.plugins.wire.scene.prefabs.render3d
        if (prefab.bloom) Object.assign(prefab.bloom, bloom)
        const pass = passOf(p => 'strength' in p && 'threshold' in p)
        if (!pass) return
        pass.strength = bloom.strength
        pass.radius = bloom.radius
        pass.threshold = bloom.threshold
      }
      bf.add(bloom, 'strength', 0, 3, 0.01).onChange(setBloom)
      bf.add(bloom, 'radius', 0, 1, 0.01).onChange(setBloom)
      bf.add(bloom, 'threshold', 0, 10, 0.05).onChange(setBloom)

      let last = performance.now(), owed = 0
      const loop = async now => {
        owed += Math.min((now - last) / 1000, 0.25)
        last = now
        // A frame that throws is logged, and the next frame goes on.
        try {
          page.input()
          while (owed >= dt) { truth.step(dt); owed -= dt }
          await page.frame(owed / dt)
        } catch (e) { console.error(e) }
        requestAnimationFrame(loop)
      }
      requestAnimationFrame(loop)
    </script>
  </body>
</html>
